spring.application.name=sl
server.port=8080

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:sashko_learn_bot}

# File Storage Configuration
file.storage.base-path=${FILE_STORAGE_PATH:/var/sashko-learn/books}
file.storage.max-file-size=52428800

# PDFBox Configuration
pdfbox.max-pages-to-analyze=100
pdfbox.enable-text-extraction=true
pdfbox.enable-bookmark-extraction=true

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sashkolearn}
spring.datasource.username=${POSTGRES_USER:sluser}
spring.datasource.password=${POSTGRES_PASSWORD:slpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Spring AI OpenAI Configuration (embeddings)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

# Spring AI Anthropic Configuration (chat / vision)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-sonnet-4-6
spring.ai.anthropic.chat.options.max-tokens=10000

# AI model aliases — change here to update all flows at once
ai.model.fast=claude-haiku-4-5-20251001
ai.model.standard=claude-sonnet-4-6
ai.model.deep=claude-opus-4-7

# Disable Spring AI auto-retry on API failures (default: 10 attempts with exp backoff)
spring.ai.retry.max-attempts=1

# Jackson Configuration
spring.jackson.deserialization.fail-on-unknown-properties=false

# Notes Synchronization Configuration
notes.path=/Users/okravch/my/sl/notes/topics
notes.sync.batch-size=10

# Obsidian Local REST API
obsidian.api.url=${OBSIDIAN_API_URL:https://127.0.0.1:27124}
obsidian.api.token=${OBSIDIAN_API_TOKEN}

# Async executor for long-running AI/IO tasks (replaces Kafka task topics)
sl.async.core-pool-size=2
sl.async.max-pool-size=4
sl.async.queue-capacity=50

# Logging
logging.level.com.sashkolearn=INFO
logging.level.org.apache.pdfbox=WARN
logging.level.org.telegram.telegrambots=INFO
