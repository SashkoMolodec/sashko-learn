services:
  redis:
    image: redis:7-alpine
    container_name: sl_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sl-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: sl_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sashkolearn
      - POSTGRES_USER=sluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-slpassword}
    volumes:
      - sl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluser -d sashkolearn"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sl-network

  sl:
    build:
      context: ./sl
      dockerfile: Dockerfile
    container_name: sl
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sashkolearn
      - POSTGRES_USER=sluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - FILE_STORAGE_PATH=/var/sashko-learn/books
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OBSIDIAN_API_URL=${OBSIDIAN_API_URL:-https://host.docker.internal:27124}
      - OBSIDIAN_API_TOKEN=${OBSIDIAN_API_TOKEN}
    volumes:
      - sl_books:/var/sashko-learn/books
      - /Users/okravch/my/sl/notes:/var/sashko-learn/notes:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sl-network

volumes:
  sl_books:
  sl_postgres_data:

networks:
  sl-network:
    driver: bridge
