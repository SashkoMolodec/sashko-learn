services:
  redis:
    image: redis:7-alpine
    container_name: sl_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy volatile-lru
    volumes:
      - sl_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sl-network

  postgres:
    image: pgvector/pgvector:pg17
    container_name: sl_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=sashkolearn
      - POSTGRES_USER=sluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-slpassword}
    volumes:
      - sl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluser -d sashkolearn"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - sl-network

  sl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sl
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=sashkolearn
      - POSTGRES_USER=sluser
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - FILE_STORAGE_PATH=/var/sashko-learn/books
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Laptop's Obsidian, exposed to the tailnet via `tailscale serve` (valid TLS cert).
      # e.g. OBSIDIAN_API_URL=https://my-laptop.tailnet-name.ts.net
      - OBSIDIAN_API_URL=${OBSIDIAN_API_URL}
      - OBSIDIAN_API_TOKEN=${OBSIDIAN_API_TOKEN}
    volumes:
      - sl_books:/var/sashko-learn/books
    # Docker's DNS doesn't resolve Tailscale MagicDNS names, and using the raw 100.x IP in the
    # URL would break the TLS cert match. Map the MagicDNS hostname -> the laptop's Tailscale IP
    # so the cert hostname is preserved while routing goes over the tailnet (Beelink must have
    # Tailscale up). Set both via .env: OBSIDIAN_HOST and OBSIDIAN_TAILSCALE_IP.
    extra_hosts:
      - "${OBSIDIAN_HOST:-obsidian.invalid}:${OBSIDIAN_TAILSCALE_IP:-127.0.0.1}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sl-network

volumes:
  sl_books:
  sl_postgres_data:
  sl_redis_data:

networks:
  sl-network:
    driver: bridge
