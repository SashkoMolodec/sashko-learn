spring.application.name=sl-main-agent
server.port=8080

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=extract_chapters_task:com.sashkolearn.mainagent.messaging.producer.dto.ExtractChaptersTaskDto,sync_notes_task:com.sashkolearn.mainagent.messaging.producer.dto.SyncNotesTaskDto,ask_question_task:com.sashkolearn.mainagent.messaging.producer.dto.AskQuestionTaskDto,analyze_note_task:com.sashkolearn.mainagent.messaging.producer.dto.AnalyzeNoteTaskDto,find_notes_task:com.sashkolearn.mainagent.messaging.producer.dto.FindNotesTaskDto,analyze_ai_task:com.sashkolearn.mainagent.messaging.producer.dto.AnalyzeAiTaskDto,quiz_generate_task:com.sashkolearn.mainagent.messaging.producer.dto.GenerateQuizTaskDto,quiz_search_task:com.sashkolearn.mainagent.messaging.producer.dto.SearchQuizzesTaskDto,quiz_get_task:com.sashkolearn.mainagent.messaging.producer.dto.GetQuizTaskDto,read_task:com.sashkolearn.mainagent.messaging.producer.dto.ReadTaskDto

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.type.mapping=extract_chapters_result:com.sashkolearn.mainagent.messaging.consumer.dto.ExtractChaptersResultDto,sync_notes_result:com.sashkolearn.mainagent.messaging.consumer.dto.SyncNotesResultDto,ask_question_result:com.sashkolearn.mainagent.messaging.consumer.dto.AskQuestionResultDto,analyze_note_result:com.sashkolearn.mainagent.messaging.consumer.dto.AnalyzeNoteResultDto,find_notes_result:com.sashkolearn.mainagent.messaging.consumer.dto.FindNotesResultDto,analyze_ai_result:com.sashkolearn.mainagent.messaging.consumer.dto.AnalyzeAiResultDto,quiz_generate_result:com.sashkolearn.mainagent.messaging.consumer.dto.GenerateQuizResultDto,quiz_search_result:com.sashkolearn.mainagent.messaging.consumer.dto.SearchQuizzesResultDto,quiz_get_result:com.sashkolearn.mainagent.messaging.consumer.dto.GetQuizResultDto,read_result:com.sashkolearn.mainagent.messaging.consumer.dto.ReadResultDto
spring.kafka.consumer.group-id=main-agent-group

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# Telegram Bot Configuration
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:sashko_learn_bot}

# File Storage Configuration
file.storage.base-path=${FILE_STORAGE_PATH:/var/sashko-learn/books}
file.storage.max-file-size=52428800

# Logging
logging.level.com.sashkolearn=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.telegram.telegrambots=INFO
